<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Musics</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav id="top">
        <ul>
            <li class="brand"><img src="images_spotify/channels4_profile.jpg" alt="s">Spotify</li>
            <li id="home"><a href="index.html">Home</a></li>
            <li id="about"><a href="about.html">About</a></li>
        </ul>
    </nav>
    <div>
        <div class="container">

            <div class="songlist">
                <h1>Best of NCS - No copyright sounds</h1>
                <div class="songItemContainer">

                    <div class="songItems">
                        <img src="images_spotify/mortals-feat-laura-brehm-1586948734-yFnA6l5Geq.jpg" alt="1">
                        <span class="songName">Mortals</span>
                        <span class="songlistplay"><span class="timestamp">03:48 <div class="songItemPlay" id="0"><i
                                        class="fa-solid fa-circle-play"></i></div></span>
                        </span>
                    </div>
                    <div class="songItems">
                        <img src="images_spotify/Fearless_img.jpg" alt="2">
                        <span class="songName">Mortals</span>
                        <span class="songlistplay"><span class="timestamp">03:14 <div class="songItemPlay" id="1"> <i
                                        class="fa-solid fa-circle-play"></i></div></span> </span>
                    </div>
                    <div class="songItems">
                        <img src="images_spotify/SkyHigh_img.jpg" alt="3">
                        <span class="songName">Mortals</span>
                        <span class="songlistplay"><span class="timestamp">03:56 <div class="songItemPlay" id="2"> <i
                                        class="fa-solid fa-circle-play"></i></div></span> </span>
                    </div>
                    <div class="songItems">
                        <img src="images_spotify/on&on_img.jpg" alt="4">
                        <span class="songName">Mortals</span>
                        <span class="songlistplay"><span class="timestamp">03:28 <div class="songItemPlay" id="3"><i
                                        class="fa-solid fa-circle-play"></i></div></span>
                    </div>
                    <div class="songItems">
                        <img src="images_spotify/invincible_img.jfif" alt="5">
                        <span class="songName">Mortals</span>
                        <span class="songlistplay"><span class="timestamp">04:33 <div class="songItemPlay" id="4"><i
                                        class="fa-solid fa-circle-play"></i></div></span>
                    </div>
                </div>

            </div>
            <div class="songBanner"></div>
        </div>
        <div class="bottom">
            <input type="range" name="range" id="progressBar" min="0" value="0" max="100">
            <div class="icons">
                <!-- fontawesome icone -->
                <i class="fa-solid fa-2x fa-backward" id="previous"></i>
                <div id="masterPlay">
                    <i class="fa-solid fa-circle-play"></i>
                </div>
                <i class="fa-solid fa-2x fa-forward" id="next"></i>
            </div>
            <div class="songInfo">
                <img src="images_spotify/music.gif" width="180px" alt="gf" id="gif"> <span
                    id="masterSongName">Mortals</span>
            </div>
        </div>
        <script src="https://kit.fontawesome.com/16b6107deb.js" crossorigin="anonymous"></script>
        <script src="script.js"></script>
</body>

</html>
